name: Ingest · Land-Use & Zoning (Deterministic)

on:
  # Staggered daily UTC cron: zoning 06:15 UTC
  # schedule:
  #   # Disabled until /bot/ is live (sa06) and ig03 has run
  #   - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      jurisdiction:
        description: 'Jurisdiction to poll'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - montgomery
          - anne_arundel

concurrency:
  group: ingest-zoning-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  ingest-zoning:
    name: Ingest Zoning Legislation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mint Swapp Bot App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SWAPP_BOT_APP_ID }}
          private-key: ${{ secrets.SWAPP_BOT_PRIVATE_KEY }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml feedparser beautifulsoup4 requests

      - name: Restore PDF Cache
        uses: actions/cache@v4
        with:
          path: .cache/pdf_cache
          key: ${{ runner.os }}-pdf-cache-${{ hashFiles('**/council_bills/*.md', '**/zta_amendments/*.md') }}
          restore-keys: |
            ${{ runner.os }}-pdf-cache-

      - name: Run Deterministic Zoning Pollers (Zero Model in Path)
        id: poll
        env:
          ENACTED_USER_AGENT: "EnactedBot/1.0 (+https://enacted.app/bot/)"
        run: |
          JUR="${{ github.event.inputs.jurisdiction || 'all' }}"
          python scripts/poll_sources.py --jurisdiction "$JUR"

      - name: Open Issue on Poller Failure
        if: failure() && steps.poll.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "[Ingestion Alert] Legislative Poller Selector Failure" \
            --body "Automated ingestion failed during deterministic polling. Inspect poller logs for the failing source URL and selector. Per Rule 10, no model was called and no fields were inferred. Human review required." \
            --label "ingestion-failure,source-alert" || true

      - name: Regenerate Syndication Feeds (Atom 1.0 & JSON Feed 1.1)
        run: |
          python generate_feeds.py

      - name: Regenerate Newsletters (Corpus-First Invariant)
        run: |
          python generate_newsletter.py

      - name: Run Corpus Integrity & Publication Gates
        id: gates
        env:
          PDF_CACHE_DIR: .cache/pdf_cache
          ENACTED_USER_AGENT: "EnactedBot/1.0 (+https://enacted.app/bot/)"
        run: |
          python scripts/wording_gate.py
          python verify_corpus_integrity.py

      - name: Open Issue on Gate Failure
        if: failure() && steps.gates.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "[Ingestion Alert] Corpus Integrity or Publication Gate Red" \
            --body "Verification gates failed following poller execution. PR creation halted. Inspect run logs." \
            --label "ingestion-failure" || true

      - name: Determine Timestamp
        id: timestamp
        run: |
          echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "ts=$(date -u +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Pull Request (Never Direct to Main)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(ingest): automated legislative record harvest [${{ steps.timestamp.outputs.date }}] (bot)"
          committer: "swapp-bot[bot] <swapp-bot[bot]@users.noreply.github.com>"
          author: "swapp-bot[bot] <swapp-bot[bot]@users.noreply.github.com>"
          branch: "bot/ingest-zoning/${{ steps.timestamp.outputs.ts }}"
          delete-branch: true
          title: "chore(ingest): automated legislative record update [${{ steps.timestamp.outputs.date }}]"
          body: |
            ### Automated Legislative Ingestion
            - **Provenance:** Ingested from primary government portals via deterministic pollers.
            - **Crawler Identity:** EnactedBot/1.0 (+https://enacted.app/bot/), honoring robots.txt and 5s host spacing.
            - **Cryptographic Gate:** All primary PDFs fetched (HTTP 200) with verified SHA-256 hashes.
            - **Views:** Syndication feeds and newsletters regenerated from backing corpus records.
            - **Integrity:** All verification gates passed before PR generation.
            - **Rule 10 Invariant:** Zero model in the ingestion path. No fields were inferred.
            - **Merge Policy:** Auto-merge is OFF. Requires human review.
          labels: "automated-ingest,needs-review"
