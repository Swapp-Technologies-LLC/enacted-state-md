name: Scheduled Ingestion & Verification

on:
  schedule:
    # Montgomery County daily at 06:00 UTC
    - cron: '0 6 * * *'
    # Anne Arundel County twice weekly (Mon & Thu at 07:00 UTC)
    - cron: '0 7 * * 1,4'
  workflow_dispatch:
    inputs:
      jurisdiction:
        description: 'Jurisdiction to poll'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - montgomery
          - anne_arundel

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ingest:
    name: Deterministic Polling & Ingestion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml feedparser beautifulsoup4 requests

      - name: Restore PDF Cache
        uses: actions/cache@v4
        with:
          path: .cache/pdf_cache
          key: ${{ runner.os }}-pdf-cache-${{ hashFiles('**/council_bills/*.md', '**/zta_amendments/*.md') }}
          restore-keys: |
            ${{ runner.os }}-pdf-cache-

      - name: Run Deterministic Pollers (Zero Model in Path)
        id: poll
        env:
          ENACTED_USER_AGENT: "EnactedCorpusBot/1.0 (+https://github.com/[FOUNDER: org]/enacted-state-md; contact: [FOUNDER: contact email])"
        run: |
          JUR="${{ github.event.inputs.jurisdiction || 'all' }}"
          python scripts/poll_sources.py --jurisdiction "$JUR"

      - name: Open Issue on Poller Failure
        if: failure() && steps.poll.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "[Ingestion Alert] Legislative Poller Selector Failure" \
            --body "Automated ingestion failed during deterministic polling. Inspect poller logs for the failing source URL and selector. Per Rule 10, no model was called and no fields were inferred. Human review required." \
            --label "ingestion-failure" || true

      - name: Regenerate Syndication Feeds (Atom 1.0 & JSON Feed 1.1)
        run: |
          python generate_feeds.py

      - name: Regenerate Newsletters (Corpus-First Invariant)
        run: |
          python generate_newsletter.py

      - name: Run Corpus Integrity & Publication Gates
        env:
          PDF_CACHE_DIR: .cache/pdf_cache
          ENACTED_USER_AGENT: "EnactedCorpusBot/1.0 (+https://github.com/[FOUNDER: org]/enacted-state-md; contact: [FOUNDER: contact email])"
        run: |
          python verify_corpus_integrity.py

      - name: Determine Timestamp
        id: timestamp
        run: |
          echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "ts=$(date -u +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Pull Request (Never Direct to Main)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.ENACTED_BOT_TOKEN }}
          commit-message: "chore(ingest): automated legislative record harvest [${{ steps.timestamp.outputs.date }}]"
          committer: "hola-there <22028053+hola-there@users.noreply.github.com>"
          author: "hola-there <22028053+hola-there@users.noreply.github.com>"
          branch: "automated-ingest/${{ steps.timestamp.outputs.ts }}"
          delete-branch: true
          title: "chore(ingest): automated legislative record update [${{ steps.timestamp.outputs.date }}]"
          body: |
            ### Automated Legislative Ingestion
            - **Provenance:** Ingested from primary government portals via deterministic pollers.
            - **Cryptographic Gate:** All primary PDFs fetched (HTTP 200) with verified SHA-256 hashes.
            - **Views:** Syndication feeds and newsletters regenerated from backing corpus records.
            - **Integrity:** All verification gates passed before PR generation.
            - **Rule 10 Invariant:** Zero model in the ingestion path. No fields were inferred.
            - **Merge Policy:** Auto-merge is OFF. Requires human review.
